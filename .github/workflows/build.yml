name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Set up Gradle 7.0.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.0.2

      - name: Remove Windows local.properties
        run: rm -f local.properties

      - name: Install SDK + NDK 22.0.7026061
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-30" "build-tools;30.0.3" "ndk;22.0.7026061"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload SO
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-native-so
          path: app/build/intermediates/cxx/Debug/*/obj/local/arm64-v8a/*.so
          if-no-files-found: warn
