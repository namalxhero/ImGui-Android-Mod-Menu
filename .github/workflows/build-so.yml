name: Build APK and SO

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 11

      - name: Set up Gradle 7.0.2
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 7.0.2
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload SO files
        uses: actions/upload-artifact@v3
        with:
          name: native-so
          path: |
            app/build/intermediates/cxx/Debug/*/obj/local/armeabi-v7a/*.so
            app/build/intermediates/merged_native_libs/debug/out/lib/armeabi-v7a/*.so
